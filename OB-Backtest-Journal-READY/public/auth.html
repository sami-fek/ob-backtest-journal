<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OB Journal — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; }

    .glass-card {
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.6);
      box-shadow: 0 8px 32px rgba(0,0,0,0.10), 0 1px 0 rgba(255,255,255,0.8) inset;
    }

    .ob-bg {
      background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 40%, #f4f7fb 100%);
      min-height: 100vh;
    }

    .accent-gradient {
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    }

    .field {
      width: 100%;
      padding: 0.625rem 0.875rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 0.625rem;
      font-size: 0.9375rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #fff;
      color: #1e293b;
    }
    .field:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }
    .field.error { border-color: #ef4444; }
    .field.error:focus { box-shadow: 0 0 0 3px rgba(239,68,68,0.12); }

    .btn-primary {
      width: 100%;
      padding: 0.6875rem 1rem;
      border-radius: 0.625rem;
      border: none;
      cursor: pointer;
      font-size: 0.9375rem;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
    }
    .btn-primary:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); }
    .btn-primary:active:not(:disabled) { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

    .tab-btn {
      flex: 1;
      padding: 0.5rem;
      border: none;
      background: transparent;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      color: #64748b;
      transition: background 0.15s, color 0.15s;
    }
    .tab-btn.active {
      background: #fff;
      color: #6366f1;
      box-shadow: 0 1px 4px rgba(0,0,0,0.10);
    }

    .alert {
      padding: 0.625rem 0.875rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      display: none;
    }
    .alert.show { display: block; }
    .alert-error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; }

    .logo-mark {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.375rem;
      font-weight: 800;
      color: #fff;
    }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card-animate { animation: fadeIn 0.3s ease; }
  </style>
</head>
<body class="ob-bg flex items-center justify-center p-4">

  <div class="w-full max-w-sm card-animate">

    <!-- Logo + Brand -->
    <div class="flex flex-col items-center mb-8">
      <div class="logo-mark accent-gradient mb-3 shadow-lg">OB</div>
      <h1 class="text-2xl font-bold text-slate-800 tracking-tight">OB Backtest Journal</h1>
      <p class="text-slate-500 text-sm mt-1">Your private trading performance log</p>
    </div>

    <!-- Card -->
    <div class="glass-card rounded-2xl p-7">

      <!-- Tabs -->
      <div class="flex bg-slate-100 rounded-xl p-1 mb-6">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- Alert -->
      <div class="alert alert-error mb-4" id="alertError"></div>
      <div class="alert alert-success mb-4" id="alertSuccess"></div>

      <!-- LOGIN FORM -->
      <form id="formLogin" onsubmit="handleLogin(event)" novalidate>
        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-1.5" for="loginEmail">Email</label>
          <input id="loginEmail" type="email" class="field" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-700 mb-1.5" for="loginPassword">Password</label>
          <input id="loginPassword" type="password" class="field" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn-primary" id="btnLogin">Sign In</button>
      </form>

      <!-- REGISTER FORM -->
      <form id="formRegister" class="hidden" onsubmit="handleRegister(event)" novalidate>
        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-1.5" for="regEmail">Email</label>
          <input id="regEmail" type="email" class="field" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium text-slate-700 mb-1.5" for="regPassword">Password</label>
          <input id="regPassword" type="password" class="field" placeholder="At least 8 characters" autocomplete="new-password" required />
        </div>
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-700 mb-1.5" for="regConfirm">Confirm Password</label>
          <input id="regConfirm" type="password" class="field" placeholder="••••••••" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn-primary" id="btnRegister">Create Account</button>
      </form>

    </div>

    <!-- Footer note -->
    <p class="text-center text-xs text-slate-400 mt-5">
      Your data is stored privately and never shared.
    </p>

  </div>

  <script>
    // ── Tab switching ──────────────────────────────────────────────────────────
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('formLogin').classList.toggle('hidden', !isLogin);
      document.getElementById('formRegister').classList.toggle('hidden', isLogin);
      document.getElementById('tab-login').classList.toggle('active', isLogin);
      document.getElementById('tab-register').classList.toggle('active', !isLogin);
      clearAlerts();
    }

    function clearAlerts() {
      const e = document.getElementById('alertError');
      const s = document.getElementById('alertSuccess');
      e.classList.remove('show'); e.textContent = '';
      s.classList.remove('show'); s.textContent = '';
    }

    function showError(msg) {
      const el = document.getElementById('alertError');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('alertSuccess').classList.remove('show');
    }

    function showSuccess(msg) {
      const el = document.getElementById('alertSuccess');
      el.textContent = msg;
      el.classList.add('show');
      document.getElementById('alertError').classList.remove('show');
    }

    function setLoading(btnId, loading) {
      const btn = document.getElementById(btnId);
      btn.disabled = loading;
      btn.textContent = loading
        ? (btnId === 'btnLogin' ? 'Signing in…' : 'Creating account…')
        : (btnId === 'btnLogin' ? 'Sign In' : 'Create Account');
    }

    // ── Redirect target ────────────────────────────────────────────────────────
    function getRedirectTarget() {
      const params = new URLSearchParams(window.location.search);
      const next = params.get('next');
      // Only redirect to relative paths on the same origin
      if (next && next.startsWith('/') && !next.startsWith('//')) return next;
      return '/';
    }

    // ── Login ──────────────────────────────────────────────────────────────────
    async function handleLogin(e) {
      e.preventDefault();
      clearAlerts();
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) { showError('Please enter your email and password.'); return; }

      setLoading('btnLogin', true);
      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const body = await res.json().catch(() => ({}));

        if (res.ok) {
          window.location.href = getRedirectTarget();
        } else {
          showError(body.error || 'Login failed. Please try again.');
          document.getElementById('loginPassword').value = '';
        }
      } catch (err) {
        showError('Network error. Please check your connection and try again.');
      } finally {
        setLoading('btnLogin', false);
      }
    }

    // ── Register ───────────────────────────────────────────────────────────────
    async function handleRegister(e) {
      e.preventDefault();
      clearAlerts();
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm  = document.getElementById('regConfirm').value;

      if (!email || !email.includes('@')) { showError('Please enter a valid email address.'); return; }
      if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
      if (password !== confirm) { showError('Passwords do not match.'); return; }

      setLoading('btnRegister', true);
      try {
        const res  = await fetch('/api/auth/register', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const body = await res.json().catch(() => ({}));

        if (res.ok) {
          showSuccess('Account created! Redirecting…');
          setTimeout(() => { window.location.href = getRedirectTarget(); }, 800);
        } else {
          showError(body.error || 'Registration failed. Please try again.');
        }
      } catch (err) {
        showError('Network error. Please check your connection and try again.');
      } finally {
        setLoading('btnRegister', false);
      }
    }

    // ── Auto-focus ─────────────────────────────────────────────────────────────
    document.getElementById('loginEmail').focus();

    // ── Read URL param for initial tab ─────────────────────────────────────────
    const tabParam = new URLSearchParams(window.location.search).get('tab');
    if (tabParam === 'register') switchTab('register');
  </script>
</body>
</html>
