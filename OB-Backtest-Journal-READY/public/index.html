<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MY Journal</title>
<style>html,body{margin:0;min-height:100%;background:#f4f7fb}#boot{font-family:system-ui,sans-serif;padding:40px;color:#475569;text-align:center}</style>
</head>
<body>
<div id="boot">Loading MY Journal…</div>
<script>
(async()=>{
  try{
    const files=['gemini-ui-1.txt','gemini-ui-2.txt','gemini-ui-3.txt','gemini-ui-4.txt'];
    const parts=await Promise.all(files.map(f=>fetch('/'+f).then(r=>{if(!r.ok)throw new Error('Missing '+f);return r.text();})));
    const b64=parts.join('').replace(/\s/g,'');
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('boot').textContent='MY Journal failed to load: '+err.message;
    console.error(err);
  }
})();
</script>
</body>
</html>
